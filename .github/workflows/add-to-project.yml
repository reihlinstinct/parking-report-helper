name: Add new items to project

# Issues only. Issue events always run this file from the default branch, so
# no pull request can change the job that receives PROJECT_PAT. There is
# deliberately no pull_request / pull_request_target trigger, so PRs are not
# added as separate board items; a PR is followed from its linked issue
# (fixes #N). See CONTRIBUTING.md and tests/test_workflow_secret_boundary.py.
on:
  issues:
    types: [opened]

permissions: {}

jobs:
  add-to-project:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/add-to-project@f2c1f1fa649a891be84948ea89b5dfba1526ef05 # v2.0.1
        with:
          project-url: https://github.com/users/reihlinstinct/projects/2
          github-token: ${{ secrets.PROJECT_PAT }}
