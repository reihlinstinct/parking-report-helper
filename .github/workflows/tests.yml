name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install ".[api]"
      - name: Run unit and CLI tests
        run: python -m unittest discover -s tests -v

  fill:
    name: Browser fill (mock form)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install package with the fill extra
        run: |
          python -m pip install ".[fill]"
          python -m playwright install --with-deps chromium
      - name: Run tests including the mock-form fill tests
        run: python -m unittest discover -s tests -v

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Run tests inside the image build
        run: docker build --target test .
      - name: Build runtime image (not pushed)
        run: docker build --target runtime --tag parking-report-helper:ci .
      - name: Smoke test
        run: |
          docker run --rm parking-report-helper:ci --help
          docker run --rm -v "$PWD:/data:ro" parking-report-helper:ci sample.json --city "Example City" | head -n 3
          test "$(docker run --rm --entrypoint id parking-report-helper:ci -u)" != 0
