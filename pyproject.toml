[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parking-report-helper"
version = "0.2.0"
description = "Turn a JSON list of vehicles into Hebrew parking-violation report drafts."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
parking-report = "parking_report.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
parking_report = ["configs/*.json"]
